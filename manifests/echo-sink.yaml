apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-sink
  namespace: demo
  labels:
    app: echo-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-sink
  template:
    metadata:
      labels:
        app: echo-sink
      annotations:
        workshop/echo-sink-revision: "3"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: echo-sink
          image: docker.io/library/python:3.13-alpine
          imagePullPolicy: Never
          command:
            - python3
            - -u
            - /app/server.py
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: source
              mountPath: /app
              readOnly: true
      volumes:
        - name: source
          configMap:
            name: echo-sink
