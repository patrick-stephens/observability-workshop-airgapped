---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-hubble-alerts
  namespace: demo
  labels:
    release: kps
spec:
  groups:
    - name: demo.hubble.network
      rules:
        - alert: DemoHighErrorRate
          # Native Cilium 1.17 httpV2 labels: status, reporter=server (destination side), and destination_workload from
          # the labelsContext set in values/cilium.yaml.
          expr: |
            sum by (destination_workload) (
              rate(hubble_http_requests_total{reporter="server", destination_namespace="demo", status=~"5.."}[1m])
            )
            /
            sum by (destination_workload) (
              rate(hubble_http_requests_total{reporter="server", destination_namespace="demo"}[1m])
            )
            > 0.05
          for: 1m
          labels:
            namespace: demo
            severity: warning
            pillar: network
          annotations:
            summary: "5xx above 5% on {{ $labels.destination_workload }}"
            description: "Source: Cilium Hubble. No application instrumentation."
