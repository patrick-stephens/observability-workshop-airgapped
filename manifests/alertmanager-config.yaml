---
# Originated in prompt 4; prompt 7 added the frontend webhook and the business pillar route.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: demo-local-webhook
  namespace: demo
  labels:
    alertmanagerConfig: workshop
spec:
  inhibitRules:
    - sourceMatch:
        - name: severity
          value: critical
          matchType: "="
        - name: pillar
          value: network
          matchType: "="
      targetMatch:
        - name: severity
          value: warning
          matchType: "="
        - name: pillar
          value: network
          matchType: "="
      equal:
        - alertname
        - namespace
        - destination_workload
  route:
    receiver: echo
    groupBy:
      - alertname
      - namespace
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 4h
    matchers:
      - name: pillar
        value: network|business
        matchType: "=~"
  receivers:
    # One notification reaches both: the echo sink logs the raw JSON, the frontend shows the translated event.
    - name: echo
      webhookConfigs:
        - url: http://echo-sink.demo.svc.cluster.local:8080/alerts
          sendResolved: true
        - url: http://frontend.demo.svc.cluster.local:8080/webhook/alertmanager
          sendResolved: true
