# Development tools and hook repositories; reasons are recorded for each pin.
pre-commit 4.2.0 - Installs and runs the repository's configured hooks.
gitleaks v8.30.1 - Detects secrets in staged changes.
pre-commit-hooks v5.0.0 - Provides whitespace, file-format, symlink, and key checks.
yamllint v1.38.0 - Lints YAML files.
conventional-pre-commit v4.4.0 - Validates commit messages against Conventional Commits.
github.com/prometheus/client_golang v1.21.1 - Exposes the Prometheus default registry through promhttp.
go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp v0.60.0 - Instruments HTTP handlers and propagates trace context on client requests.
go.opentelemetry.io/otel v1.35.0 - Provides the OpenTelemetry API for distributed tracing and propagation.
go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc v1.35.0 - Exports traces to the configured OTLP gRPC endpoint.
go.opentelemetry.io/otel/sdk v1.35.0 - Provides the OpenTelemetry SDK and trace provider.
