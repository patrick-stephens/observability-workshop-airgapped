---
apiVersion: v1
kind: Pod
metadata:
  name: hello-otel
spec:
  containers:
  - name: hello-otel
    image: localhost/hello-otel:manual
    env:
    - name: OTEL_SERVICE_NAME
      value: "hello-otel"
    - name: OTEL_TRACES_EXPORTER
      value: "otlp"
    - name: OTEL_METRICS_EXPORTER
      value: "none"
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"    
    ports:
    - containerPort: 5000
      hostPort: 8001
  - name: jaeger-all-in-one
    image: jaegertracing/all-in-one:1.76.0
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
    - containerPort: 16686
      hostPort: 16686
    - containerPort: 4318
    env:
    - name: COLLECTOR_OTLP_ENABLED
      value: "true"
    - name: OTEL_TRACES_EXPORTER
      value: "otlp"
