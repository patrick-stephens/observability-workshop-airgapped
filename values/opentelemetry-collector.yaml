---
mode: deployment
# Names the Service otel-collector, the OTEL_EXPORTER_OTLP_ENDPOINT host used by the demo app manifests.
fullnameOverride: otel-collector
replicaCount: 1
image:
  repository: docker.io/otel/opentelemetry-collector-k8s
  tag: 0.161.0
  pullPolicy: Never
command:
  name: otelcol-k8s
ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    hostPort: 0
    protocol: TCP
    appProtocol: grpc
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    hostPort: 0
    protocol: TCP
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false
config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    jaeger: null
    prometheus: null
    zipkin: null
  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}
  exporters:
    otlp/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls:
        insecure: true
    # The prompt's "otlp/prometheus (otlphttp exporter)": collector 0.161 names the OTLP/HTTP exporter type otlp_http.
    # Verified for Prometheus v3.15 (prometheus.io/docs/guides/opentelemetry): with --web.enable-otlp-receiver the
    # receiver serves POST /api/v1/otlp/v1/metrics; otlp_http appends /v1/metrics to this endpoint.
    otlp_http/prometheus:
      endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/otlp
      tls:
        insecure: true
    debug: null
  service:
    pipelines:
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp/tempo
      # Only the app's OTLP business counters use this; scraped metrics never pass through the Collector.
      metrics:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlp_http/prometheus
      logs: null
