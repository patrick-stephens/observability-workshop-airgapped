---
image:
  repository: ghcr.io/fluent/fluent-bit
  tag: 5.1.2
  pullPolicy: Never
service:
  enabled: false
  httpPort: 2021
hostVolumes:
  - name: machine-id
    hostPath:
      path: /etc/machine-id
      type: File
    mountPath: /etc/machine-id
  - name: logs
    hostPath:
      path: /var/log
      type: Directory
    mountPath: /var/log
config:
  service:
    log_level: info
  pipeline:
    inputs:
      - name: tail
        alias: k8s-logs
        path: /var/log/containers/*.log
        tag: 'kube.*'
        read_from_head: true
        multiline.parser: cri
        skip_long_lines: true
        skip_empty_lines: true
        processors:
          logs:
            - name: kubernetes
              k8s-logging.parser: true
              k8s-logging.exclude: true
    filters: []
    outputs:
      - name: loki
        alias: loki
        match: kube.*
        host: loki-gateway.observability.svc.cluster.local
        port: 80
        uri: /loki/api/v1/push
        labels: job=fluent-bit, cluster=observability
        label_keys: "$kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name']"
        line_format: json
