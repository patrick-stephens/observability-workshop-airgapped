---
image:
  repository: ghcr.io/fluent/fluent-bit
  tag: 5.1.2
  pullPolicy: Never
service:
  enabled: false
  httpPort: 2021
hostVolumes:
  - name: machine-id
    hostPath:
      path: /etc/machine-id
      type: File
    mountPath: /etc/machine-id
  - name: logs
    hostPath:
      path: /var/log
      type: Directory
    mountPath: /var/log
config:
  service:
    log_level: info
  parsers:
    - name: kubernetes-tag
      format: regex
      regex: '^(?<namespace_name>[^.]+)\.(?<pod_name>[^.]+)\.(?<container_name>[^.]+)'
  pipeline:
    inputs:
      - name: tail
        alias: k8s-logs
        path: /var/log/containers/*.log
        tag_regex: '(?<pod_name>[^_]+)_(?<namespace_name>[^_]+)_(?<container_name>.+)-'
        tag: kube.<namespace_name>.<pod_name>.<container_name>
        read_from_head: true
        multiline.parser: cri
        skip_long_lines: true
        skip_empty_lines: true
        processors:
          logs:
            - name: kubernetes
              kube_tag_prefix: kube.
              regex_parser: kubernetes-tag
              k8s-logging.parser: true
              k8s-logging.exclude: true
    filters: []
    outputs:
      - name: loki
        alias: loki
        match: kube.*
        host: loki-gateway.observability.svc.cluster.local
        port: 80
        uri: /loki/api/v1/push
        labels: job=fluent-bit, cluster=observability
        label_keys: "$kubernetes['namespace_name'],$kubernetes['pod_name'],$kubernetes['container_name']"
        line_format: json
