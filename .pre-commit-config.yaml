default_install_hook_types:
  - pre-commit
  - commit-msg
default_language_version:
  python: python3
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: feedback-redaction
        name: Check learner feedback redactions
        entry: python3 scripts/dev/check-feedback-redaction.py
        language: system
        files: ^feedback/airgap-run-[0-9]+\.md$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^content/
      - id: end-of-file-fixer
        exclude: ^content/
      - id: mixed-line-ending
        exclude: ^content/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-symlinks
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: ^content/
      - id: check-shebang-scripts-are-executable
        exclude: ^content/
      - id: check-executables-have-shebangs
        exclude: ^content/
      - id: check-case-conflict
      - id: check-illegal-windows-names
        exclude: ^content/
      - id: check-xml
      - id: pretty-format-json
        exclude: ^(slides/package-lock\.json|content/)
      - id: requirements-txt-fixer
        exclude: ^content/
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        exclude: ^content/
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose]
