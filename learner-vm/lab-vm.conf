# Fixed guest hostname used by the learner VM.
HOSTNAME="o11y-lab.internal"
# Empty uses DHCP; set an address only when the Windows host must reach the VM.
STATIC_IP=""
# Artifactory hostname used for registry and package repository checks.
ART_HOST="artifactory.internal"
# Optional Artifactory address; 30-ca-and-trust.sh can add it to /etc/hosts to bypass DNS.
ART_HOST_IP=""
# CA certificate installed in the operating system trust store.
CA_CERT_SOURCE="/etc/pki/ca-trust/source/anchors/airgap-ca.crt"
# ISO file path or CD-ROM device path attached to the VM.
ISO_PATH="/dev/cdrom"
# Candidate Docker CE DNF repository base URL configured for this lab.
DNF_DOCKER_CE_BASEURL="https://artifactory.internal/artifactory/docker-ce-rhel8/"
# Optional EPEL DNF repository base URL; empty leaves the repository unset.
DNF_EPEL_BASEURL=""
# Repository root, derived from this configuration file's location by default.
CONTENT_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"
# Root containing the five workshop repository tracks.
WORKSHOPS_ROOT="$CONTENT_ROOT/content/repos"
# Root containing the five workshop documentation tracks.
DOCS_ROOT="$CONTENT_ROOT/content/docs"
# Browser used to open workshop materials on the VM.
BROWSER="firefox"
