# Operator-tunable values for the RHEL 8.6 learner VM.
HOSTNAME="o11y-lab.internal"
# Empty keeps the base image network configuration.
STATIC_IP=""
# Base domain for Artifactory and its services.
ART_REPO_DOMAIN="artifactory.internal"
# Generic Artifactory host for package repositories and file URLs.
ART_HOST="${ART_REPO_DOMAIN}"
# Local checksum-verified files under MANUAL_FETCH_DIR take precedence over URLs.
# Required Artifactory generic-file URL for the pinned k3s binary.
# Set on the learner VM using the exact URL supplied by the administrator.
K3S_BINARY_URL=""
# Optional Artifactory generic-file URL for the pinned k3s airgap-images archive.
# Leave empty to use k3s registry mirrors; set only to the exact admin-supplied URL.
K3S_AIRGAP_IMAGES_URL=""
# Preferred endpoint: docker-registry.${ART_REPO_DOMAIN}.
# The path form ${ART_REPO_DOMAIN}/artifactory/docker-registry is also accepted.
# Leave empty to derive the dedicated subdomain from ART_REPO_DOMAIN.
DOCKER_REGISTRY=""
# Optional Artifactory address; 30-ca-and-trust.sh can add it to /etc/hosts to bypass DNS.
ART_HOST_IP=""
# CA certificate installed in the operating system trust store.
CA_CERT_SOURCE="/etc/pki/ca-trust/source/anchors/airgap-ca.crt"
# ISO file path or CD-ROM device path attached to the VM.
ISO_PATH="/dev/cdrom"
# Existing engineer account used by the provisioning scripts.
WORKSHOP_USER="engineer"
# Required by the non-interactive auto-elevate wrappers in script 50.
PASSWORDLESS_SUDO="yes"
AUTOLOGIN="yes"
# Browser used to open workshop materials on the VM.
BROWSER="firefox"
# In-VM docs server port; Perses uses host port 8080 in its labs.
DOCS_PORT="8090"
# 11r: docs server + START-HERE must use $DOCS_PORT, never 8080 (Perses owns 8080).
# Staging area for hand-fetched artifacts. Scripts check this path before
# attempting network fetches. See content/vendor/MANUAL-FETCH.md.
MANUAL_FETCH_DIR="/var/tmp/o11y-lab-vm-manual"
